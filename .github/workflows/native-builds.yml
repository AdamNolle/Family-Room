name: Native builds and shared protocol
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config
      - run: cargo check --manifest-path platforms/linux/Cargo.toml
      - run: cargo test --manifest-path platforms/linux/Cargo.toml
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: brew install xcodegen
      - run: ./script/verify.sh
      - run: ./script/build_and_run.sh --build-only
      - run: ./script/build_ios.sh
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install Android native tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./script/build_android.sh
      - run: cd platforms/android && ./gradlew assembleQaAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: family-room-android-debug
          path: dist/android/FamilyRoom-debug.apk
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --workspace --all-features
      - shell: pwsh
        run: ./script/build_windows.ps1
