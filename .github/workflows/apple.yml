name: Apple builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cp Config/Signing.example.xcconfig Config/Signing.xcconfig
      - run: ./script/verify.sh
