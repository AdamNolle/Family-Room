[package]
name = "family-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "family_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "family-core"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindings"]

[[bin]]
name = "family-gateway"
path = "src/gateway_main.rs"
required-features = ["gateway"]

[features]
bindings = ["uniffi/cli"]
gateway = ["dep:axum", "dep:tokio", "dep:tokio-util", "dep:futures-util"]

[dependencies]
uniffi = "0.29.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
tempfile = "3"
zip = { version = "2", default-features = false }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crypto_box = { version = "0.9.1", features = ["seal"] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures-util = { version = "0.3", optional = true }

[lints]
workspace = true
