[package]
name = "family-video-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "family_video_indexer"
path = "src/lib.rs"

[[bin]]
name = "family-video-indexer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
