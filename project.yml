name: FamilyRoom
options:
  bundleIdPrefix: com.familyroom
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  FamilyRoom:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Sources/FamilyRoom
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Family Room
        CFBundleName: Family Room
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: Family Room adds the photos and videos you choose to your Room.
        NSPhotoLibraryAddUsageDescription: Family Room saves finished films to your Photos library when you ask it to.
        NSHumanReadableCopyright: ""
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        FamilyRoomTeam: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyroom.app
        PRODUCT_NAME: Family Room
        PRODUCT_MODULE_NAME: FamilyRoom
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Support/FamilyRoom-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Support/FamilyRoom-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/FamilyRoom-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  FamilyRoomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: FamilyRoom_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.familyroom.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Family Room.app/Contents/MacOS/Family Room"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FamilyRoom-iOS:
    build:
      targets:
        FamilyRoom_iOS: all
    run:
      config: Debug
  FamilyRoom-macOS:
    build:
      targets:
        FamilyRoom_macOS: all
    run:
      config: Debug
    test:
      targets:
        - FamilyRoomTests
