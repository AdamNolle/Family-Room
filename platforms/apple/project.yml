name: FamilyRoom
options:
  bundleIdPrefix: com.familyroom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FamilyCoreBindings:
    type: framework
    platform: iOS
    sources:
      - path: ../../Generated/Swift/family_core.swift
      - path: FrameworkResources
        buildPhase: resources
    dependencies:
      - framework: ../../Generated/Apple/FamilyCoreNative.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.familyroom.core-bindings
  FamilyRoom:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: ../../Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: FamilyCoreBindings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyroom.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Family Room
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import and automatically share selected photos with your chosen Room.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice-over for your films.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  FamilyRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FamilyRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.familyroom.app.uitests
schemes:
  FamilyRoom:
    build:
      targets:
        FamilyRoom: all
    test:
      targets:
        - FamilyRoomUITests
