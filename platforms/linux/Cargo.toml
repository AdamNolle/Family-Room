[package]
name = "family-room-linux"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
family-core = { path = "../../crates/family-core" }
family-video-indexer = { path = "../../crates/family-video-indexer" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
